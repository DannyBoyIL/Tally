name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run everything by hand, including the live eval gate

permissions:
  contents: read

# check and e2e are deterministic and free: no model calls. The API and E2E use recorded
# extractions, and the replay gate re-scores recorded answers. Only eval-gate calls Claude.
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tally" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Eval gate on recorded answers (free)
        run: pnpm eval:replay

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tally" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tally/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The live gate: runs the golden set through Claude and compares with the accepted baseline
  # (eval/gate.json). It costs money, so it runs only on a pull request that touches something
  # that shapes the answer, or by hand. The job itself always runs and passes when it skips, so
  # it can be a required check without leaving unrelated PRs waiting.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Did anything that shapes extraction change?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "origin/$BASE...HEAD" |
              grep -E '^(packages/extractor/src/|packages/shared/src/invoice\.ts|packages/validators/src/|data/golden/|eval/src/|eval/gate\.json)' |
              grep -vE '\.test\.ts$' || true)
            echo "$changed"
            if [ -n "$changed" ]; then echo "live=true"; else echo "live=false"; fi >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.live != 'true'
        run: echo "Nothing that shapes extraction changed; live eval skipped." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.changes.outputs.live == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.changes.outputs.live == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.live == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.live == 'true'
        name: Live eval gate (about $0.12)
        run: pnpm eval --repeat 3 --gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: always() && steps.changes.outputs.live == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/runs
          retention-days: 30

  # The production image, built natively for the ARM server. Every PR proves it builds; on main
  # it is pushed to GitHub's container registry.
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally:${GITHUB_SHA}" .
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$image:$GITHUB_SHA" "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

  # Releases main to the demo server once everything passed. Skipped until the server exists
  # (the DEPLOY_HOST repository variable is set); setup in docs/DEPLOY.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: [check, e2e, eval-gate, image]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v7
      - name: Copy the compose files and restart the app on the new image
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy deploy/compose.yml deploy/Caddyfile "ubuntu@$HOST:tally/"
          ssh -i ~/.ssh/deploy "ubuntu@$HOST" \
            "cd tally && docker compose pull app && docker compose up -d --remove-orphans"
